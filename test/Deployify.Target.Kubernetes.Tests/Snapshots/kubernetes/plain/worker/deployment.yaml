apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop-worker
  labels:
    app: worker
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "worker"
    spec:
      imagePullSecrets:
        - name: "existing-pull"
        - name: "deployify-registry"
      containers:
        - name: worker
          image: "registry.example.com:5000/team/worker:1.2.3"
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
