apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop-api
  labels:
    app: api
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: "existing-pull"
        - name: "deployify-registry"
      containers:
        - name: api
          image: "registry.example.com:5000/team/api:1.2.3"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: "/health"
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: "/health"
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
