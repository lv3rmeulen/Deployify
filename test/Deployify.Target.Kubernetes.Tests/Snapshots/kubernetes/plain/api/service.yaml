apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop-api
  labels:
    app: api
    app.kubernetes.io/managed-by: deployify
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
  type: ClusterIP
