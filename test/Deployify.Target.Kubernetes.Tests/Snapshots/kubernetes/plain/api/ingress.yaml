apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: shop-api
  labels:
    app: api
    app.kubernetes.io/managed-by: deployify
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
spec:
  ingressClassName: nginx
  rules:
    - host: api.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
