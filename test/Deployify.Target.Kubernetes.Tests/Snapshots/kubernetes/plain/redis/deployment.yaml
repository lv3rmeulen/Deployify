apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop-redis
  labels:
    app: redis
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      imagePullSecrets:
        - name: "existing-pull"
        - name: "deployify-registry"
      containers:
        - name: redis
          image: "redis:7"
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 10
