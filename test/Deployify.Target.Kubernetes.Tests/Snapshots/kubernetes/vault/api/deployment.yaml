apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop-api
  labels:
    app: api
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "shop-api"
        vault.hashicorp.com/agent-inject-secret-appsettings.secrets.json: "secret/data/deployify/shop/api"
        vault.hashicorp.com/agent-inject-template-appsettings.secrets.json: |-
          {{- with secret "secret/data/deployify/shop/api" -}}
          {
            "ConnectionStrings:db": {{ print "Host=pg.shop-pg;Password=" (index .Data.data "pg-password") ";Opt=a$b" | toJSON }}
          }
          {{- end }}
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: "registry.example.com/myapp/api:v1.0.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DEPLOYIFY_SECRETS_FILE
              value: "/vault/secrets/appsettings.secrets.json"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
