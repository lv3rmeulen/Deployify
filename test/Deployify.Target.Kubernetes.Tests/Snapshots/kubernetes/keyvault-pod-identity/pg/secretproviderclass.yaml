apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pg-keyvault
  namespace: shop-pg
  labels:
    app: pg
    app.kubernetes.io/managed-by: deployify
spec:
  provider: azure
  secretObjects:
    - secretName: pg-secrets
      type: Opaque
      labels:
        app: pg
      data:
        - objectName: "pg-password"
          key: "pg-password"
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    keyvaultName: "shop-kv"
    tenantId: "11111111-2222-3333-4444-555555555555"
    objects: |-
      array:
        - |
          objectName: deployify-shop-pg-pg-password
          objectType: secret
          objectAlias: pg-password
