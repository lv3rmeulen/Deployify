apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop-api
  labels:
    app: api
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "registry.example.com/myapp/api:v1.0.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: Parameters__pg_password
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: "pg-password"
            - name: ConnectionStrings__db
              value: "Host=pg.shop-pg;Password=$(Parameters__pg_password);Opt=a$$b"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: keyvault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-keyvault
