# Generated by deployify — service: pg
# Do not edit manually. Re-run 'deployify generate' to update.

services:
  pg:
    image: "postgres:17"
    restart: unless-stopped
    profiles:
      - dev
      - prod
    ports:
      - "5432:5432/tcp"
    environment:
      POSTGRES_PASSWORD: "${Parameters__pg_password}"
    volumes:
      - data:/data/data
      - cache:/data/cache
    networks:
      - shop

volumes:
  data:
  cache:
    driver: local

networks:
  shop:
    external: true
