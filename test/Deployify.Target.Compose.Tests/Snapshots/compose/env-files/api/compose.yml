# Generated by deployify — service: api
# Do not edit manually. Re-run 'deployify generate' to update.

services:
  api:
    image: "registry.example.com/myapp/api:v1.0.0"
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "8080:8080/tcp"
      - "9125:9125/udp"
    env_file:
      - ./.env
    volumes:
      - data:/data/data
      - cache:/data/cache
      - ./config:/app/config:ro
    networks:
      - shop
    depends_on:
      pg:
        condition: service_started

  api-dapr:
    image: "daprio/daprd:latest"
    command:
      - ./daprd
      - --app-id
      - api-app
      - --dapr-http-port
      - "3500"
      - --dapr-grpc-port
      - "50001"
      - --app-port
      - "8080"
    restart: unless-stopped
    profiles:
      - prod
    network_mode: service:api
    depends_on:
      - api

volumes:
  data:
  cache:
    driver: local

networks:
  shop:
    external: true
