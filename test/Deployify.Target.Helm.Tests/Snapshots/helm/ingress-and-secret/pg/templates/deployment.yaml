apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: test-pg
  labels:
    app: pg
    app.kubernetes.io/managed-by: deployify
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pg
  template:
    metadata:
      labels:
        app: pg
    spec:
      containers:
        - name: pg
          image: "{{ if .Values.image.tag }}{{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) }}{{ else }}{{ .Values.image.repository }}{{ end }}"
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pg-config
            - secretRef:
                name: pg-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 10
