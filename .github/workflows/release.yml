name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-
            ${{ hashFiles(
              'global.json',
              'nuget.config',
              'Directory.Build.props',
              'Directory.Packages.props',
              '.config/dotnet-tools.json',
              '**/*.csproj'
            ) }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore

      # Every packable project: the CLI tool, Deployify.Hosting and the libraries it depends on
      # (Core, Targets, each target, Plugins), and the plugin SDK, contracts and testing kit.
      # Tests and samples set IsPackable to false.
      - name: Pack
        run: >
          dotnet pack
          Deployify.slnx
          --configuration Release
          --no-build
          --output ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/packages/*.nupkg
            ./artifacts/packages/*.snupkg
          if-no-files-found: error

      # Target plugins kept in this repository, as packages for the plugin index
      # (plugin-index/plugins/). Framework-dependent without an apphost, so one package serves
      # every platform. The publish job signs them.
      - name: Package plugins
        run: |
          dotnet publish src/Deployify.Target.DigitalOcean \
            --configuration Release --no-restore -p:UseAppHost=false \
            --output ./artifacts/plugins/digitalocean
          (cd ./artifacts/plugins/digitalocean && zip -r -X -q ../deployify-target-digitalocean-any.zip .)

      - name: Upload plugin packages
        uses: actions/upload-artifact@v7
        with:
          name: plugin-packages
          path: ./artifacts/plugins/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$release_commit" != "$head_commit" ]]; then
            echo "The release tag does not point to the checked-out commit." >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            test "$RELEASE_IS_PRERELEASE" = "true"
          else
            test "$RELEASE_IS_PRERELEASE" = "false"
          fi

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Login to NuGet.org
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push
          "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Download plugin packages
        uses: actions/download-artifact@v8
        with:
          name: plugin-packages
          path: ./artifacts/plugins

      - uses: sigstore/cosign-installer@v4

      # Signed keyless by this workflow at the release tag: the identity
      # plugin-index/plugins/digitalocean.json trusts. Each package gets a .sigstore.json bundle.
      - name: Sign plugin packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cd ./artifacts/plugins
          for package in *-any.zip; do
            versioned="${package%-any.zip}-${version}-any.zip"
            mv "$package" "$versioned"
            cosign sign-blob --yes --bundle "$versioned.sigstore.json" "$versioned"
          done

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            ./artifacts/plugins/*.zip \
            ./artifacts/plugins/*.sigstore.json \
            --repo "${{ github.repository }}"

      # The index lists versions explicitly; adding this one is a reviewed pull request.
      - name: Plugin index entries for this release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          {
            echo "### Plugin index"
            echo
            echo "Add this version to \`plugin-index/plugins/<id>.json\` in a pull request:"
            echo
            for package in ./artifacts/plugins/*-any.zip; do
              name="$(basename "$package")"
              echo '```json'
              echo "{ \"version\": \"$version\", \"protocol\": \"1.0\", \"packages\": { \"any\": {"
              echo "  \"url\": \"https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$name\","
              echo "  \"sha256\": \"$(sha256sum "$package" | cut -d' ' -f1)\" } } }"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
