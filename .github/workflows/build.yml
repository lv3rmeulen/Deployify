name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Deployify.slnx

      - name: Build
        run: dotnet build Deployify.slnx --configuration Release --no-restore

      # - name: Test
      #   run: dotnet test --solution Deployify.slnx --configuration Release --no-build

      - name: Test and collect coverage
        run: >
          dotnet tool run dotnet-coverage collect
          "dotnet test --configuration Release --no-build --logger GitHubActions"
          --output-format cobertura
          --output ./artifacts/coverage.cobertura.xml
