name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: >-
          Regenerate the test snapshots (DEPLOYIFY_UPDATE_SNAPSHOTS=1) and upload them as the
          "snapshots" artifact. Snapshot tests always pass in this mode; review the diff.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Deployify.slnx

      - name: Build
        run: dotnet build Deployify.slnx --configuration Release --no-restore

      - name: Test
        env:
                DEPLOYIFY_UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots && '1' || '' }}
        run: >
          dotnet tool run dotnet-coverage collect
          "dotnet test --solution Deployify.slnx --configuration Release --no-build --report-github"
          --output-format cobertura
          --output ./artifacts/coverage.cobertura.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./artifacts/coverage.cobertura.xml
          if-no-files-found: error

      - name: Summarize snapshot changes
        if: inputs.update-snapshots
        run: |
          git add --intent-to-add -- 'test/**/Snapshots/**'
          {
            echo '### Snapshot changes'
            echo '```'
            git diff --ignore-cr-at-eol --stat -- 'test/**/Snapshots/**' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshots
        if: inputs.update-snapshots
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: test/**/Snapshots/
          include-hidden-files: true
          if-no-files-found: error
