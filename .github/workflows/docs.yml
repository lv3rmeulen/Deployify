name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'samples/**'
      - 'src/Deployify/Commands/**'
      - 'tools/Deployify.DocGen/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'samples/**'
      - 'src/Deployify/Commands/**'
      - 'tools/Deployify.DocGen/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-reference:
    name: CLI reference is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate
        run: dotnet run --project tools/Deployify.DocGen -- docs/src/content/docs/reference/cli

      - name: Compare with the committed pages
        run: |
          git add --intent-to-add docs/src/content/docs/reference/cli
          if ! git diff --ignore-cr-at-eol --exit-code -- docs/src/content/docs/reference/cli; then
            echo "::error::The CLI reference is out of date. Run: dotnet run --project tools/Deployify.DocGen -- docs/src/content/docs/reference/cli"
            exit 1
          fi

  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Upload for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [cli-reference, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
