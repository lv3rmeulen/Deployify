name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'samples/**'
      - 'src/Deployify/Commands/**'
      - 'tools/Deployify.DocGen/**'
      - 'tools/Deployify.PluginIndex/**'
      - 'src/Deployify.Plugins/**'
      - 'plugin-index/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/plugin-index.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'samples/**'
      - 'src/Deployify/Commands/**'
      - 'tools/Deployify.DocGen/**'
      - 'tools/Deployify.PluginIndex/**'
      - 'src/Deployify.Plugins/**'
      - 'plugin-index/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/plugin-index.yml'
  workflow_dispatch:
  # The plugin index expires after 30 days so an old signed copy can't hide a yanked version;
  # rebuild and re-sign it weekly even when nothing changed.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-reference:
    name: CLI reference is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Regenerate
        run: dotnet run --project tools/Deployify.DocGen -- docs/src/content/docs/reference/cli

      - name: Compare with the committed pages
        run: |
          git add --intent-to-add docs/src/content/docs/reference/cli
          if ! git diff --ignore-cr-at-eol --exit-code -- docs/src/content/docs/reference/cli; then
            echo "::error::The CLI reference is out of date. Run: dotnet run --project tools/Deployify.DocGen -- docs/src/content/docs/reference/cli"
            exit 1
          fi

  plugin-index:
    name: Plugin index
    uses: ./.github/workflows/plugin-index.yml
    permissions:
      contents: read
      id-token: write
    with:
      sign: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  build:
    name: Build site
    needs: plugin-index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Served at /Deployify/plugins/index.json, with its signature.
      - name: Add the plugin index
        uses: actions/download-artifact@v8
        with:
          name: plugin-index
          path: docs/public/plugins

      - run: npm ci
      - run: npm run build

      - name: Upload for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [cli-reference, plugin-index, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
