name: Samples

on:
  push:
    branches: [main]
  pull_request:
  #schedule:
  #  - cron: '17 3 * * *' # nightly end-to-end deploys
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy the samples (end to end)
        type: boolean
        default: false

concurrency:
  group: samples-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Every push and PR: each sample builds, and Deployify can read it and generate artifacts.
  generate:
    name: ${{ matrix.sample }} · build + generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # hello-aspire's secret parameter. A test value: the sample protects nothing.
      Parameters__admin_key: ci-admin-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: hello-aspire
            solution: samples/hello-aspire/HelloAspire.slnx
            apphost: samples/hello-aspire/HelloAspire.AppHost
          - sample: aspire-deploy
            solution: samples/aspire-deploy/AspireDeploy.slnx
            apphost: samples/aspire-deploy/AspireDeploy.AppHost
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Deployify
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      - name: Build the sample
        run: dotnet build ${{ matrix.solution }} -c Release

      - name: deployify generate
        run: dotnet src/Deployify/bin/Release/net10.0/deployify.dll generate --project-path ${{ matrix.apphost }}

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.sample }}
          path: ${{ matrix.apphost }}/deployify-output/
          if-no-files-found: error

  # Every push and PR: publish hello-aspire's project (api) and Dockerfile build (web) to a real
  # registry, then check that the digests Deployify recorded are what the registry serves and
  # that the generated artifacts pin them.
  publish-registry:
    name: hello-aspire · publish to a registry, pin by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-aspire/HelloAspire.AppHost
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DEPLOYIFY: dotnet ${{ github.workspace }}/src/Deployify/bin/Release/net10.0/deployify.dll
      REGISTRY: localhost:5000
      TAG: ${{ github.sha }}
      # The .NET SDK pushes to the job's registry over plain HTTP. Docker allows localhost as is.
      DOTNET_CONTAINER_INSECURE_REGISTRIES: localhost:5000
      # The sample's secret parameter. A test value: the sample protects nothing.
      Parameters__admin_key: ci-admin-key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Deployify
        working-directory: .
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      # The image tag goes in the state file too: generate looks digests up by repository and tag.
      - name: Use the job's registry and the commit tag
        run: |
          jq --arg registry "$REGISTRY" --arg tag "$TAG" \
            '.Environments.local.ContainerRegistry = $registry | .Environments.local.ImageTag = $tag' \
            deployify-state.json > deployify-state.tmp
          mv deployify-state.tmp deployify-state.json

      - name: deployify publish
        run: $DEPLOYIFY publish

      - name: deployify generate
        run: $DEPLOYIFY generate

      - name: images.json holds the digests the registry serves
        run: |
          images=.deployify/state/local/images.json
          [ -f "$images" ] || { echo "::error::$images was not written"; exit 1; }
          cat "$images"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          for service in api web; do
            repository="$REGISTRY/$service"
            digest=$(jq -r --arg key "$repository:$TAG" '.images[$key].digest // empty' "$images")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::images.json has no digest for $repository:$TAG"; exit 1; }
            served=$(curl -fsS -o /dev/null -D - -H "Accept: $accept" "http://$REGISTRY/v2/$service/manifests/$TAG" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
            echo "$service: recorded $digest, registry serves $served for :$TAG"
            [ "$served" = "$digest" ] \
              || { echo "::error::$repository:$TAG is $served in the registry, but images.json recorded $digest"; exit 1; }
          done

      - name: The generated artifacts reference the images by digest
        run: |
          images=.deployify/state/local/images.json
          for service in api web; do
            repository="$REGISTRY/$service"
            digest=$(jq -r --arg key "$repository:$TAG" '.images[$key].digest' "$images")
            grep -rlF "$repository@$digest" deployify-output \
              || { echo "::error::No generated artifact references $repository@$digest"; exit 1; }
          done
          # A built image referenced by tag would deploy whatever the tag points at later.
          if grep -rnE "$REGISTRY/[a-z0-9._/-]+:[A-Za-z0-9._-]+" deployify-output; then
            echo "::error::A generated artifact references a built image by tag"
            exit 1
          fi

      - name: Upload the published state and generated artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-hello-aspire
          path: |
            samples/hello-aspire/HelloAspire.AppHost/.deployify/state/local/images.json
            samples/hello-aspire/HelloAspire.AppHost/deployify-output/
          include-hidden-files: true
          if-no-files-found: warn

  # Every push and PR: build once, promote, deploy. hello-aspire is published to one path of the
  # job's registry (staging), promoted to another path (prod) with crane, and prod deploys it with
  # --require-digest. The copy must keep each digest, and prod must run exactly those digests.
  promote-registry:
    name: hello-aspire · promote with crane, deploy by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-aspire/HelloAspire.AppHost
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DEPLOYIFY: dotnet ${{ github.workspace }}/src/Deployify/bin/Release/net10.0/deployify.dll
      REGISTRY: localhost:5000
      TAG: ${{ github.sha }}
      CRANE_VERSION: v0.22.1
      # The .NET SDK pushes to the job's registry over plain HTTP. crane and Docker allow localhost as is.
      DOTNET_CONTAINER_INSECURE_REGISTRIES: localhost:5000
      # The sample's secret parameter. A test value: the sample protects nothing.
      Parameters__admin_key: ci-admin-key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Deployify
        working-directory: .
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      - name: Install crane
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION"
          archive=go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" crane
          sudo install crane /usr/local/bin/crane
          crane version

      # Same registry, two repository paths: localhost:5000/staging/api and localhost:5000/prod/api.
      - name: staging and prod on two paths of the job's registry
        run: |
          jq --arg registry "$REGISTRY" '
            .Environments.local as $local
            | .ActiveEnvironment = "staging"
            | .Environments = {
                staging: ($local | .ContainerRegistry = ($registry + "/staging")),
                prod: ($local
                  | .ContainerRegistry = ($registry + "/prod")
                  | .TargetConfig.compose.ProjectName = "hello-aspire-prod")
              }' deployify-state.json > deployify-state.tmp
          mv deployify-state.tmp deployify-state.json
          cat deployify-state.json

      - name: deployify publish (staging)
        run: $DEPLOYIFY publish --env staging --image-tag "$TAG"

      - name: deployify promote staging → prod
        run: $DEPLOYIFY promote --from staging --to prod --image-tag "$TAG" --copy-with crane

      - name: The copied images have the source digests
        run: |
          images=.deployify/state/prod/images.json
          [ -f "$images" ] || { echo "::error::promote did not write $images"; exit 1; }
          cat "$images"
          for service in api web; do
            source=$(crane digest "$REGISTRY/staging/$service:$TAG")
            copied=$(crane digest "$REGISTRY/prod/$service:$TAG")
            recorded=$(jq -r --arg key "$REGISTRY/prod/$service:$TAG" '.images[$key].digest // empty' "$images")
            echo "$service: staging $source, prod $copied, recorded for prod $recorded"
            [[ "$source" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::$REGISTRY/staging/$service:$TAG has no digest"; exit 1; }
            [ "$copied" = "$source" ] \
              || { echo "::error::The copy of $service changed its digest: $source → $copied"; exit 1; }
            [ "$recorded" = "$source" ] \
              || { echo "::error::promote recorded '$recorded' for prod's $service, not $source"; exit 1; }
          done

      # Promoting again changes nothing: every image is already recorded for prod.
      - name: Promoting again is a no-op
        run: |
          out=$($DEPLOYIFY promote --from staging --to prod --image-tag "$TAG" --copy-with crane)
          echo "$out"
          echo "$out" | grep -q '0 newly recorded' \
            || { echo "::error::A second promote recorded images again"; exit 1; }

      - name: deployify apply --require-digest (prod)
        run: $DEPLOYIFY apply --env prod --image-tag "$TAG" --require-digest --auto-approve --health-timeout 180

      - name: prod runs the promoted digests
        run: |
          for service in api web; do
            digest=$(crane digest "$REGISTRY/staging/$service:$TAG")
            image=$(docker ps --filter label=com.docker.compose.project=hello-aspire-prod \
              --filter label=com.docker.compose.service=$service --format '{{.Image}}')
            echo "$service runs $image"
            [ "$image" = "$REGISTRY/prod/$service@$digest" ] \
              || { echo "::error::prod's $service runs '$image', not $REGISTRY/prod/$service@$digest"; exit 1; }
          done

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8080/); then
              echo "$body"
              echo "$body" | grep -q '"logged"' && exit 0
            fi
            sleep 2
          done
          echo "::error::The api did not answer on http://localhost:8080/"
          docker compose ls
          docker ps -a
          exit 1

      - name: Upload the promoted state and generated artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promoted-hello-aspire
          path: |
            samples/hello-aspire/HelloAspire.AppHost/.deployify/state/*/images.json
            samples/hello-aspire/HelloAspire.AppHost/deployify-output/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Destroy
        if: always()
        run: $DEPLOYIFY destroy --env prod --auto-approve --volumes

  # Every push and PR: deploy hello-aspire to a kind cluster with `ci --auto-approve`, once with the
  # Kubernetes target (kubectl) and once with the Helm target (one chart per service), call it,
  # then destroy it. Images go through a registry the cluster's nodes pull from, as in a real cluster.
  deploy-kind:
    name: hello-aspire · ci on kind (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [Kubernetes, Helm]
    defaults:
      run:
        working-directory: samples/hello-aspire/HelloAspire.AppHost
    env:
      DEPLOYIFY: dotnet ${{ github.workspace }}/src/Deployify/bin/Release/net10.0/deployify.dll
      KIND_VERSION: v0.31.0
      CLUSTER: deployify
      # Pushed to from the runner as localhost:5001; the nodes reach the same registry as
      # kind-registry:5000 (see "Create the kind cluster").
      REGISTRY: localhost:5001
      PREFIX: hello-aspire
      TAG: ${{ github.sha }}
      # The .NET SDK pushes to the registry over plain HTTP. Docker allows localhost as is.
      DOTNET_CONTAINER_INSECURE_REGISTRIES: localhost:5001
      # The sample's secret parameter. A test value: the sample protects nothing.
      Parameters__admin_key: ci-admin-key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Deployify
        working-directory: .
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      - name: Install kind
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION"
          curl -fsSLo kind-linux-amd64 "$base/kind-linux-amd64"
          curl -fsSLo kind-linux-amd64.sha256sum "$base/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
          kind version
          kubectl version --client
          helm version --short

      # kind's local registry recipe (https://kind.sigs.k8s.io/docs/user/local-registry/). Node
      # images from kind v0.27 on read /etc/containerd/certs.d, so no containerd patch is needed.
      - name: Create the kind cluster with a local registry
        run: |
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --network bridge --name kind-registry registry:3
          kind create cluster --name "$CLUSTER" --wait 120s
          for node in $(kind get nodes --name "$CLUSTER"); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
            printf '[host."http://kind-registry:5000"]\n' \
              | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml
          done
          docker network connect kind kind-registry
          kubectl cluster-info --context "kind-$CLUSTER"

      - name: Point the sample at the cluster with the ${{ matrix.target }} target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq --arg target "$TARGET" --arg registry "$REGISTRY" --arg prefix "$PREFIX" --arg context "kind-$CLUSTER" '
            .Environments.local.Target = $target
            | .Environments.local.ContainerRegistry = $registry
            | .Environments.local.TargetConfig = {
                kubernetes: { Context: $context, NamespacePrefix: $prefix }
              }' deployify-state.json > deployify-state.tmp
          mv deployify-state.tmp deployify-state.json
          cat deployify-state.json

      - name: deployify ci --auto-approve
        run: $DEPLOYIFY ci --auto-approve --image-tag "$TAG" --health-timeout 300

      - name: The built images run pinned by digest
        run: |
          for service in api web; do
            image=$(kubectl get deployment "$service" -n "$PREFIX-$service" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "$service runs $image"
            case "$image" in
              "$REGISTRY/$service@sha256:"*) ;;
              *) echo "::error::$service is not running $REGISTRY/$service by digest: '$image'"; exit 1 ;;
            esac
          done

      # The api answers once Redis and Postgres both do; "logged" comes from Postgres.
      - name: Smoke test
        run: |
          forward() { # service local-port
            port=$(kubectl get service "$1" -n "$PREFIX-$1" -o jsonpath='{.spec.ports[0].port}')
            kubectl port-forward -n "$PREFIX-$1" "service/$1" "$2:$port" > "$RUNNER_TEMP/forward-$1.log" 2>&1 &
          }
          forward api 18080
          forward web 18085

          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:18080/); then
              echo "$body"
              echo "$body" | grep -q '"logged"' && break
            fi
            [ "$i" = 30 ] && { echo "::error::The api did not answer through kubectl port-forward"; cat "$RUNNER_TEMP"/forward-api.log; exit 1; }
            sleep 2
          done

          curl -fsS http://localhost:18085/ | grep -q 'deployed by Deployify' \
            || { echo "::error::The static site did not answer"; cat "$RUNNER_TEMP"/forward-web.log; exit 1; }

          without=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/reset)
          with=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Admin-Key: $Parameters__admin_key" http://localhost:18080/reset)
          echo "POST /reset without the key: $without, with it: $with"
          [ "$without" = 401 ] && [ "$with" = 204 ] || { echo "::error::Expected 401 without the admin key and 204 with it"; exit 1; }

      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,pvc,secrets,configmaps -A -l app.kubernetes.io/managed-by=deployify || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          for ns in $(kubectl get ns -o name | grep "/$PREFIX-" | cut -d/ -f2); do
            kubectl describe pods -n "$ns" || true
            kubectl logs -n "$ns" --all-containers --tail=100 -l app || true
          done
          [ "${{ matrix.target }}" = Helm ] && helm list -A || true

      - name: Status
        if: always()
        run: $DEPLOYIFY status

      - name: Destroy
        if: always()
        run: $DEPLOYIFY destroy --auto-approve --volumes

      # Destroy leaves only the "<prefix>-system" namespace with the generated parameter values.
      - name: Destroy removed every service
        run: |
          left=$(kubectl get ns -o name | cut -d/ -f2 | grep "^$PREFIX-" | grep -vx "$PREFIX-system" || true)
          [ -z "$left" ] || { echo "::error::Namespaces left after destroy: $left"; exit 1; }
          if [ "${{ matrix.target }}" = Helm ]; then
            releases=$(helm list -A -q)
            [ -z "$releases" ] || { echo "::error::Helm releases left after destroy: $releases"; exit 1; }
          fi

  # Nightly (or on demand): really deploy to Docker Compose on the runner, call it, tear it down.
  deploy-compose:
    name: hello-aspire · deploy to Docker Compose
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-aspire/HelloAspire.AppHost
    env:
      DEPLOYIFY: dotnet ${{ github.workspace }}/src/Deployify/bin/Release/net10.0/deployify.dll
      # The sample's secret parameter. A test value: the sample protects nothing.
      Parameters__admin_key: ci-admin-key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Deployify
        working-directory: .
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      - name: Plan
        run: $DEPLOYIFY plan

      - name: Publish images
        run: $DEPLOYIFY publish

      - name: Apply
        run: $DEPLOYIFY apply --auto-approve --health-timeout 180

      # The api answers once Redis and Postgres both do; "logged" comes from Postgres.
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8080/); then
              echo "$body"
              echo "$body" | grep -q '"logged"' && exit 0
            fi
            sleep 2
          done
          echo "::error::The api did not answer on http://localhost:8080/"
          docker compose ls
          docker ps -a
          exit 1

      - name: The static site answers
        run: curl -fsS http://localhost:8085/ | grep -q 'deployed by Deployify'

      - name: The admin key reached the api
        run: |
          without=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/reset)
          with=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Admin-Key: $Parameters__admin_key" http://localhost:8080/reset)
          echo "POST /reset without the key: $without, with it: $with"
          [ "$without" = 401 ] && [ "$with" = 204 ] || { echo "::error::Expected 401 without the admin key and 204 with it"; exit 1; }

      - name: Plan shows no drift after the deploy
        run: $DEPLOYIFY ci --skip-validate --skip-apply --fail-on-changes

      - name: Status
        if: always()
        run: $DEPLOYIFY status

      - name: Destroy
        if: always()
        run: $DEPLOYIFY destroy --auto-approve --volumes

  deploy-aspire:
    name: aspire-deploy · aspire deploy to Docker Compose
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/aspire-deploy/AspireDeploy.AppHost
    # Images go through a registry, so publishing records digests that the deploy can require.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DEPLOYIFY: dotnet ${{ github.workspace }}/src/Deployify/bin/Release/net10.0/deployify.dll
      # The .NET SDK pushes to the job's registry over plain HTTP.
      DOTNET_CONTAINER_INSECURE_REGISTRIES: localhost:5000
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Same version as Aspire.AppHost.Sdk in the sample and Aspire.Hosting in Directory.Packages.props.
      - name: Install the Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.6.5

      - name: Build Deployify
        working-directory: .
        run: dotnet build src/Deployify/Deployify.csproj -c Release

      - name: Use the job's registry
        run: |
          jq '.Environments.local.ContainerRegistry = "localhost:5000"' deployify-state.json > deployify-state.tmp
          mv deployify-state.tmp deployify-state.json

      # Built elsewhere than aspire deploy, as in a pipeline that builds once and deploys later.
      - name: Publish the images with the commit tag
        run: $DEPLOYIFY publish --image-tag ${{ github.sha }}

      - name: aspire deploy
        run: aspire deploy --non-interactive
        env:
          Deployify__AutoApprove: 'true'
          Deployify__HealthTimeoutSeconds: '180'
          Deployify__Publish: 'false'
          Deployify__ImageTag: ${{ github.sha }}
          Deployify__RequireDigest: 'true'

      - name: The api runs the commit's image, pinned by digest
        run: |
          image=$(docker ps --filter label=com.docker.compose.project=aspire-deploy-sample \
            --filter label=com.docker.compose.service=api --format '{{.Image}}')
          echo "api image: $image"
          case "$image" in
            localhost:5000/api@sha256:*) ;;
            *) echo "::error::The api is not running localhost:5000/api by digest: '$image'"; exit 1 ;;
          esac
          curl -fsS http://localhost:5000/v2/api/tags/list | tee /dev/stderr | grep -q '"${{ github.sha }}"' \
            || { echo "::error::The registry has no api image tagged ${{ github.sha }}"; exit 1; }

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/ && exit 0
            sleep 2
          done
          echo "::error::The api did not answer on http://localhost:8090/"
          docker ps -a
          exit 1

      - name: Destroy
        if: always()
        run: $DEPLOYIFY destroy --auto-approve
